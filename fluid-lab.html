<!doctype html><html lang="en"><meta charset="utf-8"><title>Crimson Vigil | Fluid Lab</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#090b12;color:#eee;font:14px system-ui}#panel{position:absolute;top:15px;left:15px;background:#101522e8;padding:18px;border:1px solid #454451;border-radius:12px;max-width:280px}button,input{margin:5px}button{background:#83213a;color:white;border:0;border-radius:5px;padding:9px;cursor:pointer}small{color:#bbb}#stats{font:12px monospace}</style><div id="panel"><h2>Crimson Vigil · Fluid Lab</h2><p>Standalone 3D grid fluid experiment. No gameplay required.</p><button id="drop">Drop blood</button><button id="jet">Side impact</button><button id="reset">Reset</button><button id="pause">Pause</button><p>Gravity <input id="gravity" type="range" min="0" max="20" value="10" step=".5"><span id="gv">10</span></p><p>Viscosity <input id="visc" type="range" min="0" max=".25" value=".04" step=".01"><span id="vv">.04</span></p><p id="stats"></p><small>Drag to orbit, scroll to zoom. Red cells represent simulated liquid volume; this is a diagnostic voxel renderer, not final smooth liquid shading.</small></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const N=24,M=18,K=24,L=N*M*K,idx=(x,y,z)=>(z*M+y)*N+x;
const density=new Float32Array(L),u=new Float32Array(L),v=new Float32Array(L),w=new Float32Array(L),p=new Float32Array(L),next=new Float32Array(L),tmp=new Float32Array(L),un=new Float32Array(L),vn=new Float32Array(L),wn=new Float32Array(L);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b12);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(27,22,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.update();
scene.add(new THREE.HemisphereLight(0xc6d5ff,0x34211f,2));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(10,20,7);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(N,K),new THREE.MeshStandardMaterial({color:0x353a3a,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.52;scene.add(floor);
scene.add(new THREE.GridHelper(N,N,0x606060,0x343434));
const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.94,.94,.94),new THREE.MeshPhysicalMaterial({color:0x9f001b,roughness:.18,metalness:.05,clearcoat:1}),L);mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(mesh);const dummy=new THREE.Object3D();
const clamp=(n,max)=>Math.max(0,Math.min(max-1,n));
function sample(a,x,y,z){x=clamp(x,N);y=clamp(y,M);z=clamp(z,K);const x0=Math.floor(x),y0=Math.floor(y),z0=Math.floor(z),x1=Math.min(N-1,x0+1),y1=Math.min(M-1,y0+1),z1=Math.min(K-1,z0+1),fx=x-x0,fy=y-y0,fz=z-z0;
const lerp=(a,b,t)=>a+(b-a)*t;return lerp(lerp(lerp(a[idx(x0,y0,z0)],a[idx(x1,y0,z0)],fx),lerp(a[idx(x0,y1,z0)],a[idx(x1,y1,z0)],fx),fy),lerp(lerp(a[idx(x0,y0,z1)],a[idx(x1,y0,z1)],fx),lerp(a[idx(x0,y1,z1)],a[idx(x1,y1,z1)],fx),fy),fz)}
function inject(side=false){for(let z=1;z<K-1;z++)for(let y=2;y<M-2;y++)for(let x=1;x<N-1;x++){const dx=x-(side?5:N/2),dy=y-12,dz=z-K/2;if(dx*dx+dy*dy+dz*dz<18){const i=idx(x,y,z);density[i]=1;u[i]=side?8:0;v[i]=side?2:0;w[i]=0}}}
function clear(){for(const a of [density,u,v,w,p,next,tmp,un,vn,wn])a.fill(0)}
function advect(src,dst,dt){for(let z=0;z<K;z++)for(let y=0;y<M;y++)for(let x=0;x<N;x++){const i=idx(x,y,z);dst[i]=sample(src,x-u[i]*dt,y-v[i]*dt,z-w[i]*dt)}}
function step(dt){
 // Advect velocity and liquid volume through a shared Eulerian field.
 advect(u,un,dt);advect(v,vn,dt);advect(w,wn,dt);
 u.set(un);v.set(vn);w.set(wn);
 const gravity=+document.getElementById('gravity').value,visc=+document.getElementById('visc').value;
 for(let z=1;z<K-1;z++)for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){const i=idx(x,y,z);if(density[i]>.02)v[i]-=gravity*dt;u[i]*=1-visc*dt;v[i]*=1-visc*dt;w[i]*=1-visc*dt}
 // Project velocity field toward divergence-free, with zero normal flow at walls.
 p.fill(0);
 for(let z=1;z<K-1;z++)for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){const i=idx(x,y,z);tmp[i]=-.5*(u[idx(x+1,y,z)]-u[idx(x-1,y,z)]+v[idx(x,y+1,z)]-v[idx(x,y-1,z)]+w[idx(x,y,z+1)]-w[idx(x,y,z-1)])}
 for(let iter=0;iter<24;iter++){for(let z=1;z<K-1;z++)for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){const i=idx(x,y,z);next[i]=(tmp[i]+p[idx(x-1,y,z)]+p[idx(x+1,y,z)]+p[idx(x,y-1,z)]+p[idx(x,y+1,z)]+p[idx(x,y,z-1)]+p[idx(x,y,z+1)])/6}p.set(next)}
 for(let z=1;z<K-1;z++)for(let y=1;y<M-1;y++)for(let x=1;x<N-1;x++){const i=idx(x,y,z);u[i]-=.5*(p[idx(x+1,y,z)]-p[idx(x-1,y,z)]);v[i]-=.5*(p[idx(x,y+1,z)]-p[idx(x,y-1,z)]);w[i]-=.5*(p[idx(x,y,z+1)]-p[idx(x,y,z-1)])}
 for(let z=0;z<K;z++)for(let y=0;y<M;y++)for(let x=0;x<N;x++){const i=idx(x,y,z);if(x===0||x===N-1)u[i]=0;if(y===0||y===M-1)v[i]=0;if(z===0||z===K-1)w[i]=0}
 advect(density,next,dt);density.set(next);
}
function draw(){let count=0,mass=0;for(let z=0;z<K;z++)for(let y=0;y<M;y++)for(let x=0;x<N;x++){const d=density[idx(x,y,z)];mass+=d;if(d<.13)continue;dummy.position.set(x-N/2+.5,y,z-K/2+.5);dummy.scale.setScalar(Math.max(.15,Math.min(1,Math.cbrt(d))));dummy.updateMatrix();mesh.setMatrixAt(count++,dummy.matrix)}mesh.count=count;mesh.instanceMatrix.needsUpdate=true;document.getElementById('stats').textContent='Visible cells: '+count+' | density sum: '+mass.toFixed(1)}
let paused=false,last=performance.now(),acc=0;function animate(now){requestAnimationFrame(animate);const elapsed=Math.min(.05,(now-last)/1000);last=now;if(!paused){acc+=elapsed;let n=0;while(acc>=1/60&&n++<3){step(1/60);acc-=1/60}}draw();controls.update();renderer.render(scene,camera)}requestAnimationFrame(animate);
document.getElementById('drop').onclick=()=>inject(false);document.getElementById('jet').onclick=()=>inject(true);document.getElementById('reset').onclick=clear;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};for(const [a,b] of [['gravity','gv'],['visc','vv']])document.getElementById(a).oninput=e=>document.getElementById(b).textContent=e.target.value;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
inject();</script></html>
