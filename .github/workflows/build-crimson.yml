name: Build and smoke-test Crimson Vigil
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Crimson Vigil/index.html'
      - '.github/workflows/build-crimson.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and bundle pinned Three.js r128
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o /tmp/three.min.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('Crimson Vigil/index.html').read_text(encoding='utf-8')
          lib=Path('/tmp/three.min.js').read_text(encoding='utf-8')
          assert len(lib)>400000, 'Three.js download is incomplete'
          pat=r'<script\s+src="https://cdnjs\.cloudflare\.com/ajax/libs/three\.js/r128/three\.min\.js"[^>]*></script>'
          replacement='<script>\n'+lib.replace('</script','<\\/script')+'\n</script>'
          src,count=re.subn(pat,lambda m:replacement,src,count=1,flags=re.S)
          assert count==1,'Expected one external Three.js script'
          assert 'new THREE.' in src
          Path('dist/Crimson_Vigil_Standalone.html').write_text(src,encoding='utf-8')
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',src,re.S)):
              Path(f'/tmp/crimson-script-{i}.js').write_text(script,encoding='utf-8')
          PY
          for file in /tmp/crimson-script-*.js; do node --check "$file"; done
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test startup and DESCEND
        run: |
          cat > /tmp/test-crimson.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const failures=[];
            page.on('pageerror',e=>failures.push(e.message));
            await page.goto('file://'+process.cwd()+'/dist/Crimson_Vigil_Standalone.html');
            await page.waitForTimeout(2500);
            if(!(await page.evaluate(()=>typeof THREE!=='undefined')))failures.push('THREE missing');
            if(await page.locator('body').innerText().then(t=>t.includes('Game startup error')))failures.push('Startup error displayed');
            const play=page.locator('#play');
            if(!(await play.count()))failures.push('DESCEND button missing');
            else {await play.click({timeout:10000});await page.waitForTimeout(3000);}
            if(await page.locator('body').innerText().then(t=>t.includes('Game startup error')))failures.push('Startup error after DESCEND');
            if(failures.length)throw Error(failures.join(' | '));
            await page.screenshot({path:'dist/startup-smoke-test.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/test-crimson.cjs
      - name: Upload tested standalone game
        uses: actions/upload-artifact@v4
        with:
          name: Crimson-Vigil-Standalone-Tested
          path: dist/Crimson_Vigil_Standalone.html
          if-no-files-found: error
