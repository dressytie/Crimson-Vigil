name: Combat regression smoke test
on:
  push:
    branches: [fix/restore-ragdoll-blood-20261107]
  pull_request:
    branches: [main]
    paths:
      - 'Crimson Vigil/index.html'
      - '.github/workflows/combat-regression.yml'
      - 'APPROVED_COMBAT_CHECKPOINT.md'
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all inline game scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Crimson Vigil/index.html').read_text()
          start=s.index('/* Blood Rush build:')
          Path('/tmp/crimson-game.js').write_text(s[start:s.index('</script>',start)])
          PY
          node --check /tmp/crimson-game.js
      - name: Protect approved combat effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Crimson Vigil/index.html').read_text()
          required={
            'approved 15 anatomical regions': 'regions=Array.from({length:15}',
            'original mesh breakaway geometry': 'const clone=item.mesh.clone(false)',
            'six-piece anatomical partition': 'populated.slice(0,Math.min(6,populated.length))',
            'shared original corpse geometry': 'sharedGeometry:true',
            'approved directional blood size profile': 'const factor=[0,.12,.62,1][level]',
            'curved whip renderer': "else if(f.t=='whip')",
            '180-degree Gore Whip sweep': 'hw=Math.PI/2',
          }
          missing=[name for name,needle in required.items() if needle not in s]
          if missing:
              raise SystemExit('Approved combat regression: '+', '.join(missing))
          print('Approved combat implementation guardrails passed')
          PY
      - name: Install browser testing
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise imported ghoul, ragdoll and blood
        run: |
          python3 -m http.server 8765 --directory 'Crimson Vigil' >/tmp/crimson-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            await page.locator('#play').click({timeout:15000});
            // Every new descent starts on the mandatory weapon-pick screen.
            await page.locator('#cards .card').first().click({timeout:15000});
            await page.waitForFunction(()=>G&&G.state==='play',{timeout:15000});
            await page.waitForTimeout(500);
            const result=await page.evaluate(()=>{
              if(!G||G.state!=='play')throw Error('Game not playing');
              const spawn=(t)=>{
                spawnE(t,G.p.x+100,G.p.y+100);
                const e=G.en[G.en.length-1];
                if(!e.me){e.me=mkE(e);dyn.add(e.me);e.me.position.set(e.x*S,0,e.y*S);e.me.scale.setScalar(eSc(e))}
                return e;
              };
              cvSettings.blood=3;
              const before=G.rag.length;
              const enemy=spawn('skeleton');
              hit(enemy,enemy.hp+10000,'greatsword',190,Math.PI/2);
              if(!enemy.dead||G.rag.length<=before)throw Error('Death did not produce corpse');
              const corpse=G.rag[G.rag.length-1];
              if(!corpse.pieces||corpse.pieces.length<4||corpse.pieces.length>6)throw Error('Expected 4-6 original-mesh breakaway pieces, got '+(corpse.pieces?.length||0));
              if(!corpse.sharedGeometry||corpse.pieces.some(p=>!p.m.children.length))throw Error('Corpse did not retain original geometry');
              const bloodCount=G.pa.length;
              if(bloodCount<1)throw Error('No approved blood particles');
              cvSettings.blood=0;
              const off=spawn('skeleton');hit(off,off.hp+10000,'greatsword',100,0);
              if(G.pa.length>bloodCount)throw Error('Off produces blood particles');
              return {breakawayPieces:corpse.pieces.length,originalMeshes:true,bloodHigh:true,bloodOff:true};
            });
            console.log('Combat checks:',result);
            if(errors.length)throw Error(errors.join(' | '));
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
