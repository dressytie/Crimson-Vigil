# Netlify configuration for the repository layout.
# The actual website is in "Crimson Vigil/" (not repository root).
[build]
  base = "Crimson Vigil"
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

[context.production]
  command = ""

[context.branch-deploy]
  command = ""

[context.deploy-preview]
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
